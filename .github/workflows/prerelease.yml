name: Pre-release

on:
    push:
        tags:
            - "v*.*.*-*"

permissions:
    contents: write

jobs:
    create-prerelease:
        name: Build and Create Pre-release
        runs-on: ubuntu-latest
        steps:
            - name: Install archive tools
              run: sudo apt install zip

            - name: Checkout tagged commit
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.sha }}

            - name: Setup bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Set env
              run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

            - name: Install dependencies
              run: bun install --frozen-lockfile
              working-directory: web

            - name: Run build
              run: bun run build
              working-directory: web
              env:
                  CI: false

            - name: Bump manifest version
              run: bun .github/actions/bump-manifest-version.js
              env:
                  TGT_RELEASE_VERSION: ${{ github.ref_name }}

            - name: Bundle files
              run: |
                  mkdir -p ./temp/fd_laptop
                  mkdir -p ./temp/fd_laptop/web/
                  cp ./{LICENSE,README.md,fxmanifest.lua,init.lua,types.lua} ./temp/fd_laptop
                  cp -r ./{bridge,config,data,locales,modules,optional,utils,stream} ./temp/fd_laptop
                  cp -r ./web/dist ./temp/fd_laptop/web/
                  cd ./temp && zip -r ../fd_laptop.zip ./fd_laptop

            - name: Create Pre-release
              uses: softprops/action-gh-release@v2
              with:
                  name: ${{ env.RELEASE_VERSION }}
                  prerelease: true
                  files: fd_laptop.zip

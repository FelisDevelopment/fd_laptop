name: Release

on:
    push:
        tags:
            - "v*.*.*"

jobs:
    create-release:
        name: Build and Create Tagged Release
        runs-on: ubuntu-latest
        steps:
            - name: Install archive tools
              run: sudo apt install zip

            - name: Checkout source code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.repository.default_branch }}

            - name: Setup bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Set env
              run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

            - name: Install dependencies
              run: bun install --frozen-lockfile
              working-directory: web

            - name: Run build
              run: bun run build
              working-directory: web
              env:
                  CI: false

            - name: Bump manifest version
              run: bun .github/actions/bump-manifest-version.js
              env:
                  TGT_RELEASE_VERSION: ${{ github.ref_name }}

            - name: Push manifest change
              uses: EndBug/add-and-commit@v8
              with:
                  add: fxmanifest.lua
                  push: true
                  author_name: Manifest Bumper
                  author_email: 41898282+github-actions[bot]@users.noreply.github.com
                  message: "chore: bump manifest version to ${{ github.ref_name }}"

            - name: Update tag ref
              uses: EndBug/latest-tag@latest
              with:
                  tag-name: ${{ github.ref_name }}

            - name: Bundle files
              run: |
                  mkdir -p ./temp/fd_laptop
                  mkdir -p ./temp/fd_laptop/web/
                  cp ./{LICENSE,README.md,fxmanifest.lua,init.lua,types.lua} ./temp/fd_laptop
                  cp -r ./{bridge,config,data,locales,modules,optional,utils,stream} ./temp/fd_laptop
                  cp -r ./web/dist ./temp/fd_laptop/web/
                  cd ./temp && zip -r ../fd_laptop.zip ./fd_laptop

            - name: Create Release
              uses: "marvinpinto/action-automatic-releases@v1.2.1"
              id: auto_release
              with:
                  repo_token: "${{ secrets.GITHUB_TOKEN }}"
                  title: ${{ env.RELEASE_VERSION }}
                  prerelease: false
                  files: fd_laptop.zip

              env:
                  CI: false
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
